<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập hệ thống CRM</title>
    <link rel="stylesheet" href="SignUp_LogIn_Form.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
  <body>

    <!-- Giao diện tùy biến từ template của @leonam-silva-de-souza -->
      <div class="container">
          <div class="form-box login">
              <form id="loginForm">
                  <h1>Đăng nhập</h1>
                  <div class="input-box">
                      <input type="text" id="username" placeholder="Tên đăng nhập" required>
                      <i class='bx bxs-user'></i>
                  </div>
                  <div class="input-box">
                      <input type="password" id="password" placeholder="Mật khẩu" required>
                      <i class='bx bx-show toggle-eye' id="eye" title="Hiện/ẩn mật khẩu"></i>
                  </div>
                  <div class="error" id="error"></div>
                  <div class="forgot-link">
                      <a href="#" id="forgot">Quên mật khẩu?</a>
                  </div>
                  <button type="submit" class="btn" id="btn">Đăng nhập</button>

                                    <!-- Tài khoản demo (chỉ dùng khi thử nghiệm): admin / admin123, sales / sales123 -->
                  <p class="hint"><i class='bx bxs-info-circle'></i> Tài khoản do quản trị viên cấp.<br>Nếu chưa có tài khoản, vui lòng liên hệ quản trị viên hệ thống.</p>             
             </form>
          </div>

          <div class="toggle-box">
              <div class="toggle-panel toggle-left">
                  <i class='bx bxs-bar-chart-alt-2 brand-icon'></i>
                  <h1>CRM Logistics</h1>
                  <p>Hệ thống quản lý quan hệ khách hàng</p>
                  <span class="welcome" id="welcome">Chào mừng bạn quay trở lại</span>
              </div>
          </div>
      </div>

      <script src="SignUp_LogIn_Form.js"></script>
  </body>
</html>
